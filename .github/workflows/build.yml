name: Build React Capacitor APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up JDK 17 (Matches Capacitor 6 Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Dependencies & Build React Web App
        run: |
          npm install
          npm run build

      - name: 5. Install & Initialize Capacitor 6 Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Macro Calculator" com.sameer.macrocalculator --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 6. Compile Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Macro-Calculator-React-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
